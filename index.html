<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to AR Rahman Tribute</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            font-family: Arial, sans-serif;
        }
        .splash-container {
            text-align: center;
            color: white;
        }
        .splash-title {
            font-size: 3em;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 2s forwards;
        }
        .splash-subtitle {
            font-size: 1.5em;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeIn 2s forwards 1s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .enter-button {
            padding: 15px 30px;
            font-size: 1.2em;
            background: transparent;
            color: white;
            border: 2px solid white;
            cursor: pointer;
            transition: all 0.3s;
            opacity: 0;
            animation: fadeIn 2s forwards 2s;
        }
        .enter-button:hover {
            background: white;
            color: black;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <h1 class="splash-title">A.R. Rahman</h1>
        <p class="splash-subtitle">The Golden Musician</p>
        <button class="enter-button" onclick="window.location.href='HTML/tribute.html'">Enter Site</button>
    </div>
</body>
</html>
